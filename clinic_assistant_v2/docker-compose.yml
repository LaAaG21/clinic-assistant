# Secrets come from .env (copy .env.example). Each service receives only the
# variables it needs, never the whole file.
name: clinic-assistant-v2

services:
  qdrant:
    image: qdrant/qdrant:v1.20.2
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks: [clinic-net]

  appointments-mcp:
    build:
      context: .
      dockerfile: servers/appointments/Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ports:
      - "127.0.0.1:8001:8001"
    networks: [clinic-net]

  # pharmacy-mcp (item 2) goes here

  medical-records-mcp:
    build:
      context: .
      dockerfile: servers/medical_records/Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ports:
      - "127.0.0.1:8003:8003"
    networks: [clinic-net]

  # knowledge-mcp (item 5) goes here

  # api (item 6) goes here

networks:
  clinic-net:

volumes:
  qdrant-data:

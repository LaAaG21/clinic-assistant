[project]
name = "clinic-assistant-v2"
version = "0.1.0"
description = "Clinic assistant v2: per-domain FastMCP servers with JWT auth (#314)"
requires-python = ">=3.14"
# Core every MCP server needs; heavier packages live in groups so images stay small.
dependencies = ["fastmcp>=3,<4", "pyjwt>=2.10,<3"]

[dependency-groups]
rag = ["qdrant-client>=1.15,<2", "openai>=2,<3"]
ingest = ["pypdf>=5,<7"]
api = ["fastapi>=0.162,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "langgraph>=1,<2"]
dev = ["pytest>=9", "pytest-asyncio>=1", "fpdf2>=2.8,<3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.uv]
# Tests need every group; Dockerfiles opt out with --no-default-groups.
default-groups = "all"

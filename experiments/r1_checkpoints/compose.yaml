services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: spike
      POSTGRES_USER: spike
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - checkpoints-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spike -d spike"]
      interval: 2s
      timeout: 3s
      retries: 15

  spike:
    build: .
    environment:
      DATABASE_URL: postgresql://spike:${POSTGRES_PASSWORD}@db:5432/spike
    depends_on:
      db:
        condition: service_healthy

volumes:
  checkpoints-data:

[project]
name = "clinic-retrieval-experiment"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.3.6,<4"]

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff>=0.17.3", "mypy>=2.4.1"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["."]
addopts = "--strict-markers -p no:cacheprovider"
markers = ["postgres: needs a real PostgreSQL reachable through DATABASE_URL"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "clinic-assistant"
version = "0.1.0"
description = "Minimal API foundation for the Clinic Front-Desk Assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy==2.4.0",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff==0.16.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/clinic_assistant"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=clinic_assistant --cov-branch --cov-report=term-missing --cov-fail-under=80"
markers = ["integration: requires PostgreSQL through TEST_DATABASE_URL"]

[tool.coverage.run]
source = ["clinic_assistant"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
